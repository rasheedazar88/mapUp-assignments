# Local stack: PostGIS + Go API (+ the React frontend, optional).
#
#   docker compose up --build            → db + backend   (API on http://localhost:8080)
#   docker compose --profile full up --build  → also serves the frontend on http://localhost:3000
#
# Migrations run automatically when the backend starts.

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geofence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geofence}
      POSTGRES_DB: ${POSTGRES_DB:-geofence}
    ports:
      - "${DB_HOST_PORT:-5433}:5432" # 5433 on the host avoids clashing with a locally installed PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    image: ${BACKEND_IMAGE:-geofence-backend:local}
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-geofence}:${POSTGRES_PASSWORD:-geofence}@db:5432/${POSTGRES_DB:-geofence}?sslmode=disable
      # Read from CORS_ALLOWED_ORIGINS (not ALLOWED_ORIGINS) so an unrelated global
      # ALLOWED_ORIGINS variable on the host can't silently override it.
      ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      API_KEY: ${API_KEY:-}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-5}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:

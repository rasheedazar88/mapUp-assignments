# Render Blueprint: deploys the Go backend (Docker) + a managed PostgreSQL database.
# Render Postgres supports the PostGIS extension; the backend's first migration
# runs `CREATE EXTENSION IF NOT EXISTS postgis` automatically.
#
# Usage: Render dashboard → New → Blueprint → select this repo.
# After the frontend is on Vercel, set ALLOWED_ORIGINS to its URL.

services:
  - type: web
    name: geofence-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: geofence-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://your-frontend.vercel.app
      - key: RATE_LIMIT_RPS
        value: "5"
      - key: RATE_LIMIT_BURST
        value: "10"
      - key: LOG_LEVEL
        value: info

databases:
  - name: geofence-db
    plan: free
    databaseName: geofence
    user: geofence
